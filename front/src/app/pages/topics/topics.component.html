<div class="mx-auto max-w-5xl px-4 py-6 sm:px-8">
  <p *ngIf="errorMessage" class="text-center text-sm text-red-600">
    {{ errorMessage }}
  </p>

  <div *ngIf="!isLoading; else loading">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <article
        *ngFor="let topic of topics"
        class="flex flex-col gap-3 rounded-lg bg-gray-100 p-5"
      >
        <h2 class="text-lg font-bold text-gray-900">{{ topic.title }}</h2>

        <p class="text-sm text-gray-700">{{ topic.description }}</p>

        <div class="mt-2 flex justify-center">
          <button
            type="button"
            [disabled]="topic.isSubscribed"
            class="rounded-md px-6 py-2 font-medium text-white transition disabled:cursor-not-allowed"
            [class.bg-mdd]="!topic.isSubscribed"
            [class.hover:bg-mdd-dark]="!topic.isSubscribed"
            [class.bg-gray-400]="topic.isSubscribed"
            (click)="subscribe(topic)"
          >
            {{ topic.isSubscribed ? 'Déjà abonné' : "S'abonner" }}
          </button>
        </div>
      </article>
    </div>
  </div>

  <ng-template #loading>
    <p class="text-center text-gray-600">Chargement...</p>
  </ng-template>
</div>
