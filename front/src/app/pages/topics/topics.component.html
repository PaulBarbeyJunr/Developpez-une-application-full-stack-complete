<div class="topics-container">
  <nav class="topics-nav">
    <a routerLink="/feed">Fil d'actualité</a>
    <a routerLink="/profile">Mon profil</a>
  </nav>

  <h1>Thèmes disponibles</h1>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="topics-list" *ngIf="!isLoading; else loading">
    <article class="topic-card" *ngFor="let topic of topics">
      <h2>{{ topic.title }}</h2>
      <p>{{ topic.description }}</p>
      <button
        mat-raised-button
        color="primary"
        [disabled]="topic.isSubscribed"
        (click)="subscribe(topic)"
      >
        {{ topic.isSubscribed ? 'Déjà abonné' : "S'abonner" }}
      </button>
    </article>
  </div>

  <ng-template #loading>
    <p>Chargement...</p>
  </ng-template>
</div>
