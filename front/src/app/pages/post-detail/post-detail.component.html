<div class="mx-auto max-w-4xl px-4 py-6 sm:px-8">
  <p *ngIf="errorMessage" class="text-center text-sm text-red-600">
    {{ errorMessage }}
  </p>

  <article *ngIf="post; else loading">
    <!-- Titre + fleche retour -->
    <div class="mb-6 flex items-center gap-4">
      <button
        type="button"
        class="text-gray-700"
        aria-label="Retour"
        (click)="goBack()"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1 class="text-2xl font-bold text-gray-900">{{ post.title }}</h1>
    </div>

    <!-- Metadonnees -->
    <div class="mb-6 flex flex-wrap gap-x-8 gap-y-1 text-sm text-gray-700">
      <span>{{ post.createdAt | date: 'dd/MM/yyyy' }}</span>
      <span>{{ post.author }}</span>
      <span>{{ post.topicTitle }}</span>
    </div>

    <!-- Contenu -->
    <p class="whitespace-pre-wrap leading-relaxed text-gray-800">
      {{ post.content }}
    </p>

    <hr class="my-8 border-gray-300" />

    <!-- Commentaires -->
    <section>
      <h2 class="mb-6 text-lg text-gray-900">Commentaires</h2>

      <p
        *ngIf="post.comments.length === 0"
        class="mb-6 text-sm text-gray-600"
      >
        Aucun commentaire pour le moment.
      </p>

      <div class="mb-8 flex flex-col gap-4">
        <div
          *ngFor="let comment of post.comments"
          class="flex items-start gap-4"
        >
          <span class="w-28 shrink-0 pt-2 text-sm text-gray-800">
            {{ comment.author }}
          </span>
          <div class="flex-1 rounded-2xl bg-gray-200 px-4 py-3">
            <p class="whitespace-pre-wrap text-sm text-gray-800">
              {{ comment.content }}
            </p>
          </div>
        </div>
      </div>

      <!-- Formulaire d'ajout de commentaire -->
      <form
        [formGroup]="commentForm"
        (ngSubmit)="onSubmitComment()"
        class="flex items-start gap-3"
      >
        <textarea
          formControlName="content"
          rows="3"
          placeholder="Écrivez ici votre commentaire"
          class="flex-1 resize-none rounded-xl border border-gray-300 px-4 py-3 text-sm text-gray-800 focus:border-mdd focus:outline-none"
        ></textarea>
        <button
          type="submit"
          [disabled]="commentForm.invalid || isSubmittingComment"
          aria-label="Envoyer"
          class="mt-2 flex h-10 w-10 items-center justify-center text-mdd transition hover:text-mdd-dark disabled:cursor-not-allowed disabled:opacity-40"
        >
          <mat-icon>send</mat-icon>
        </button>
      </form>

      <p *ngIf="commentError" class="mt-2 text-sm text-red-600">
        {{ commentError }}
      </p>
    </section>
  </article>

  <ng-template #loading>
    <p *ngIf="isLoading" class="text-center text-gray-600">Chargement...</p>
  </ng-template>
</div>
